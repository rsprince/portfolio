<div class="page-wrapper">
  <h1>Mobile</h1>

	<!-- Image Thumbnail -->
	<div class="image-container">
		<!-- "for" directive now a function, track image/image.id, etc. improves performance -->
		@for (image of imageList; track image) {
			<div class="vertical-image-item" (click)="openImage(image)">
				<img src="images/mobile/{{ image }}" loading="lazy" alt="Thumbnail">
			</div>
		}
	</div>

	<!-- Full-size Image Overlay -->
	<div class="image-overlay" [class.show]="isOverlayVisible" (click)="closeImage()">
		@if (selectedImage) {
			<img [src]="selectedImage" alt="Full-size Image">
		}
	</div>

</div>
