<div class="page-wrapper">
	<h1>Web</h1>

	<!-- NG v17+, CommonModule import not needed -->
	<div class="image-container">
		<!-- inline "for" syntax, now a function, track image/image.id, etc. improves performance -->
		@for (image of imageList; track image) {
			<div class="image-item" (click)="openImage(image)">
				<img src="images/web/{{ image }}" loading="lazy" alt="Thumbnail">
				<!-- <img src="{{ image }}" alt="Thumbnail"> -->
				<!-- [src]="img"	Property Binding	✅ More efficient, prevents re-evaluations	❌ Slightly more complex syntax -->
				<!-- src="{{ img }}"	Interpolation	✅ More readable, works in most cases	❌ Re-evaluates expression every time Angular checks for changes -->
			</div>
		}
	</div>

	<!-- For pre Angular 17 -->
	<!-- 
		<div *ngFor="let image of imageList">
				<img src="images/web/ADP-psatool.jpg" class="img-sml" alt="">
		</div>    
		-->

	<!-- Full-size Image Overlay -->
	<div class="image-overlay" [class.show]="isOverlayVisible" (click)="closeImage()">
		<img *ngIf="selectedImage" [src]="selectedImage" alt="Full-size Image">
	</div>
		
	
</div>
